services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: budgetapp
      POSTGRES_USER: budgetapp
      POSTGRES_PASSWORD: budgetapp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgetapp -d budgetapp"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://budgetapp:budgetapp@db:5432/budgetapp?schema=public
    ports:
      - "3000:3000"

volumes:
  postgres_data:
